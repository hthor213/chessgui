# spec:220 workspace (steps 4-7). packages/* holds the extracted libraries;
# apps/* holds the platform shells (desktop today; web per spec:221 next).
packages:
  - packages/*
  - apps/*
# sharp is a transitive optional dep of next@16, used only by the Next.js
# image-optimization server. Both shells are `output: 'export'` with
# `images: { unoptimized: true }`, so it is never invoked — skip its
# native build step.
allowBuilds:
  sharp: false
